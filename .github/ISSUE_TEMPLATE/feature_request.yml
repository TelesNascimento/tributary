name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which part of your RTC workflow is slow or impossible in the IDE today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How should it work? Mention the equivalent Git or RTC Eclipse action if there is one.
    validations:
      required: true
